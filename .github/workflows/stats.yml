name: Refresh profile assets

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 03:17 UTC 重建
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts + tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-jetbrains-mono fonts-noto-cjk
          pip install --quiet fonttools

      - name: Fetch real numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_stats.py

      - name: Rebuild SVGs
        run: |
          export FONT_MONO="$(fc-match -f '%{file}' 'JetBrains Mono')"
          export FONT_MONO_BOLD="$(fc-match -f '%{file}' 'JetBrains Mono:bold')"
          export FONT_SERIF_CJK="$(fc-match -f '%{file}' 'Noto Serif CJK SC')"
          echo "mono=$FONT_MONO"; echo "monoB=$FONT_MONO_BOLD"; echo "serif=$FONT_SERIF_CJK"
          python scripts/build_assets.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets snapshot.json
          git diff --cached --quiet || git commit -m "chore: refresh profile assets [skip ci]"
          git push
